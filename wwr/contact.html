<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Contact Us | Rafting Travel</title>
    <meta name="description"
      content="Contact Rafting Travel for reservations, questions, and general inquiries.">
    <meta name="author" content="José Bejarano">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.jpg" alt="Rafting Travel logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <h1>Contact Us | Rafting Travel</h1>

        <section class="contact-info">
            <h2>Rafting Travel Information</h2>
            <div class="company-info">
                <p><strong>Address:</strong> 245 River Canyon Road, Green Valley, CO 80435, USA</p>
                <p><strong>Phone:</strong> +1 (970) 555-2847</p>
                <p><strong>Email:</strong> contact@raftingtravel.com</p>
            </div>
            <!--Google Map Section Iframe-->
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d4334.517021500674!2d-49.972933!3d-25.185328!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94c2abd76c919c9d%3A0x61e1420655f923b5!2sParque%20de%20Natureza%20Buraco%20do%20Padre!5e1!3m2!1spt-BR!2sbr!4v1785610190495!5m2!1spt-BR!2sbr"
              width="600" height="450" allowfullscreen="" loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin">
            </iframe>

            <div class="contact-form">
                <form>
                    <ol>
                        <li>
                            <label for="q1">Name</label>
                            <input type="text" id="q1" name="q1" required>

                        </li>
                        <li>
                            <label for="q2">Email</label>
                            <input type="email" id="q2" name="q2" required>

                        </li>
                        <li>
                            <fieldset>
                                <legend>Message Purpose</legend>


                                <label for="General">General Inquiry
                                    <input type="radio" id="General" name="q3"
                                      value="General Inquiry" required>
                                </label>
                                <label for="Reservation"> Reservation Question
                                    <input type="radio" id="Reservation" name="q3"
                                      value="Reservation Question">
                                </label>
                                <label for="Website"> Website Suggestion
                                    <input type="radio" id="Website" name="q3"
                                      value="Website Suggestion">

                                </label>
                            </fieldset>
                        </li>
                        <li>
                            <label for="Message">Message
                                <textarea name="Message" id="Message" rows="5" required></textarea>
                            </label>

                        </li>
                        <li>
                            <label for="q5">
                                Please subscribe me to the monthly newsletter
                                <input type="checkbox" id="q5" name="q5">

                            </label>

                        </li>
                    </ol>
                    <button type="submit">Get in Touch!</button>

                </form>

            </div>

        </section>

        <section class="employer-profile">
            <h2> We Are Here to Serve You</h2>
            <!--Employers-->
            <figure>
                <img src="images/ethan-profile.jpg" alt="Ethan Brooks Lead River Guide">
                <figcaption>Ethan Brooks Lead River Guide</figcaption>
            </figure>
            <figure>
                <img src="images/sophia.jpg" alt="Sophia Miller Customer Service Specialist">
                <figcaption>Sophia Miller Customer Service Specialist</figcaption>
            </figure>
            <figure>
                <img src="images/emma.jpg" alt="Emma Carter General Manager">
                <figcaption>Emma Carter General Manager</figcaption>
            </figure>

        </section>

    </main>
    <footer>
        <p>&copy; 2026 | Rafting Travel | José Bejarano</p>

        <nav class="socialmedia">
            <a href="https://www.facebook.com">
                <img src="images/facebook.png" alt="facebook icon">
            </a>
            <a href="https://www.linkedin.com">
                <img src="images/linkedin.png" alt="linkedin icon">
            </a>
            <a href="https://www.instagram.com">
                <img src="images/instagram.png" alt="Instagram icon">
            </a>
        </nav>

    </footer>
</body>

</html>
